<!doctype html>
<html lang="ja">
 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <title>Kadai2 YePyaeOo</title>
 
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
 
  <style>
    #hub {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 999;
    }
 
    select {
      font-size: 20px;
      padding: 12px 20px;
      border: none;
      background-color: royalblue;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }
 
    select option {
      background-color: white;
      color: black;
    }


  </style>
</head>
 
<body>
 
  <div id="hub">
    <select id="animationSelect">
      <option value="CharacterArmature|Idle">Idle</option>
      <option value="CharacterArmature|Walk">Walk</option>
      <option value="CharacterArmature|Run">Run</option>
      <option value="CharacterArmature|Jump">Jump</option>
      <option value="CharacterArmature|Idle_Gun">Gun</option>
      <option value="CharacterArmature|Gun_Shoot">Shoot</option>
      <option value="CharacterArmature|Punch_Left">Punch</option>
      <option value="CharacterArmature|Kick_Left">Kick</option>
      <option value="CharacterArmature|HitRecieve">Hit</option>
      <option value="CharacterArmature|Death">Death</option>
    </select>
    <button id="enlargeButton">big</button>
    <button id="rotateButton">rotate</button>
  </div>
 
  <a-scene embedded arjs="sourceType: webcam">
    
    <a-marker preset="hiro" smooth="true">
        <a-entity id="model" position="0 0 -0.5">
            <a-gltf-model
                id="businessman"
                src="businessman.glb"
                position="0 0 0.5"
                scale="0.3 0.3 0.3"
                rotation="-90 0 0"
                animation-mixer="clip: Idle">
            </a-gltf-model>

        </a-entity>
      
    </a-marker>
 
    <a-entity camera></a-entity>
 
  </a-scene>
 
  <script>
    const businessman = document.getElementById("businessman");
    const animationSelect = document.getElementById("animationSelect");
    const model = document.getElementById("model");
    const enlargeButton = document.getElementById("enlargeButton");
    const rotateButton = document.getElementById("rotateButton");

    let size = 1;
    function enlargeModel(){
        size = size + 0.1;
        model.setAttribute("scale", `${size} ${size} ${size}`);
    }
    enlargeButton.addEventListener("click", enlargeModel);

    let angle = 0;
    function rotateModel(){
        angle += 15;
        model.setAttribute("rotation", `0 0 ${angle}`);
    }
    rotateButton.addEventListener("click", rotateModel);


    function changeAnimation(){
        businessman.setAttribute("animation-mixer","clip",animationSelect.value);
    }
    animationSelect.addEventListener("change",changeAnimation);
 
  </script>
 
</body>
</html>
