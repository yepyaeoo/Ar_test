<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>

    <a-scene>
    
        <a-sphere position="0 2 0" radius="0.6" color="grey"></a-sphere>
        <a-box position="0 0.9 0" width="0.8" height="0.9" depth="0.7" color="grey"></a-box>
        <a-box position="0 0.9 -0.01" width="0.5" height="0.4"  color="gold"></a-box>
      
        <a-sphere position="-0.22 2.1 0.5" radius="0.07" color="gold"></a-sphere>
        <a-sphere position="0.22 2.1 0.5" radius="0.07" color="gold"></a-sphere>

        <a-box position="0 1 0" width="0.2" height="0.5" rotation="0 90 0" color="gold"></a-box>
        
        <a-box position="-0.25 0.3 0" width="0.18" height="0.4"  color="gold"></a-box>
        <a-box position="0.25 0.3 0" width="0.18" height="0.4"  color="gold"></a-box>

        <a-camera position="0 1.6 3.5" ></a-camera>    

    </a-scene>
    
</body>
</html>
